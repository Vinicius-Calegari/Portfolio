name: Verificar sistema
on:
  push:
    branches: [salgados-rosilene]
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
