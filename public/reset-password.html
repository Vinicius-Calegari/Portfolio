<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Recuperar acesso — Salgados Rosilene</title>
  <style>
    :root{color-scheme:light;--bg:#fff8f2;--card:#fff;--text:#34241c;--muted:#7d695e;--line:#ead9cf;--accent:#8f3e2f}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}main{width:min(460px,92vw);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 18px 50px #6f46321a}h1{margin:0 0 8px;font-size:1.8rem}p{color:var(--muted);line-height:1.55}form{display:grid;gap:14px;margin-top:22px}label{display:grid;gap:7px;font-weight:600}input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;font:inherit}button,a.button{display:inline-flex;justify-content:center;align-items:center;padding:12px 14px;border-radius:11px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.secondary{background:#f4e9e2!important;color:var(--text)!important}.row{display:flex;gap:10px;flex-wrap:wrap}.msg{padding:11px 12px;border-radius:10px;background:#f7eee8;color:var(--text);display:none}.msg.show{display:block}.ok{background:#e7f6ea}.error{background:#fde9e7}.hidden{display:none}
  </style>
</head>
<body>
<main>
  <h1>Recuperar acesso</h1>
  <p>Use o e-mail administrativo para receber um link do Supabase e definir uma nova senha.</p>

  <div id="message" class="msg"></div>

  <form id="request-form">
    <label>E-mail
      <input id="email" type="email" autocomplete="email" value="viniciuscalegari036@gmail.com" required />
    </label>
    <button id="request-btn" type="submit">Enviar link de recuperação</button>
  </form>

  <form id="change-form" class="hidden">
    <label>Nova senha
      <input id="new-password" type="password" autocomplete="new-password" minlength="10" required />
    </label>
    <label>Confirmar nova senha
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="10" required />
    </label>
    <button id="change-btn" type="submit">Salvar nova senha</button>
  </form>

  <div class="row" style="margin-top:16px">
    <a class="button secondary" href="/painel">Voltar ao painel</a>
    <a class="button secondary" href="/">Voltar ao site</a>
  </div>
</main>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const supabase = createClient(
    'https://gqhscywjjvvjspajqkgt.supabase.co',
    'sb_publishable_YzukiEXAFxUVDBolbIclBg_hYCiDB_S'
  );

  const requestForm = document.querySelector('#request-form');
  const changeForm = document.querySelector('#change-form');
  const messageBox = document.querySelector('#message');
  const requestBtn = document.querySelector('#request-btn');
  const changeBtn = document.querySelector('#change-btn');

  function message(text, type='') {
    messageBox.textContent = text;
    messageBox.className = `msg show ${type}`;
  }

  function showChangePassword() {
    requestForm.classList.add('hidden');
    changeForm.classList.remove('hidden');
    message('Link validado. Agora escolha sua nova senha.', 'ok');
  }

  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session) showChangePassword();
  });

  const { data: current } = await supabase.auth.getSession();
  if (current.session && (location.hash.includes('type=recovery') || location.search.includes('type=recovery'))) {
    showChangePassword();
  }

  requestForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    requestBtn.disabled = true;
    requestBtn.textContent = 'Enviando…';
    const email = document.querySelector('#email').value.trim();
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: `${location.origin}/reset-password.html`,
    });
    if (error) message(error.message, 'error');
    else message('Link enviado. Verifique o e-mail e abra o link de recuperação.', 'ok');
    requestBtn.disabled = false;
    requestBtn.textContent = 'Enviar link de recuperação';
  });

  changeForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = document.querySelector('#new-password').value;
    const confirm = document.querySelector('#confirm-password').value;
    if (password !== confirm) return message('As senhas não coincidem.', 'error');
    changeBtn.disabled = true;
    changeBtn.textContent = 'Salvando…';
    const { error } = await supabase.auth.updateUser({ password });
    if (error) {
      message(error.message, 'error');
    } else {
      await supabase.auth.signOut();
      message('Senha atualizada. Você já pode entrar no painel com a nova senha.', 'ok');
      changeForm.classList.add('hidden');
    }
    changeBtn.disabled = false;
    changeBtn.textContent = 'Salvar nova senha';
  });
</script>
</body>
</html>
