<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cupons | Salgados Rosilene</title><style>body{margin:0;background:#f8f4ef;color:#29211d;font:16px Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top a{color:#8b3524}.card{background:#fff;border:1px solid #eadfd5;border-radius:18px;padding:22px;margin:20px 0;box-shadow:0 10px 30px #5f291d0c}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}label{display:grid;gap:6px;font-weight:700}input,select,button{font:inherit;padding:11px 12px;border:1px solid #d8c8bb;border-radius:10px}button{cursor:pointer;background:#8b3524;color:#fff;border:0;font-weight:700}.secondary{background:#eee4dc;color:#5f291d}.danger{background:#fff0ed;color:#9a2f24;border:1px solid #efc4bd}.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid #eee}.row:first-child{border-top:0}.muted{color:#76675f}.error{color:#a52a2a}.ok{color:#287a3d}@media(max-width:700px){.grid{grid-template-columns:1fr}.top,.row{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><small>PAINEL ADMINISTRATIVO</small><h1>Cupons de desconto</h1><p class="muted">Crie e remova cupons. O cliente pode fazer o pedido normalmente sem cupom.</p></div><a href="/painel">← Voltar ao painel</a></div><section class="card"><h2>Novo cupom</h2><form id="form" class="grid"><label>Código<input id="codigo" maxlength="40" placeholder="EX.: ROSILENE10" required></label><label>Tipo<select id="tipo"><option value="percentual">Percentual (%)</option><option value="fixo">Valor fixo (R$)</option></select></label><label>Valor<input id="valor" type="number" min="0.01" step="0.01" required></label><button type="submit">Adicionar cupom</button></form><p id="msg"></p></section><section class="card"><div class="top"><h2>Cupons cadastrados</h2><button id="refresh" class="secondary">Atualizar</button></div><div id="list">Carregando…</div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const url='https://gqhscywjjvvjspajqkgt.supabase.co',key='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxaHNjeXdqanZ2anNwYWpxa2d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzMzMDgsImV4cCI6MjEwNjM0OTMwOH0.07N8qTbpYsmCuWj71y9EXUevM-Nrcrg62Ss68SlreVA',db=createClient(url,key);const $=s=>document.querySelector(s),msg=$('#msg'),list=$('#list');const money=c=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(c/100);async function auth(){const{data}=await db.auth.getSession();if(!data.session){location.href='/painel';return false}const r=await db.rpc('sou_admin');if(r.error||!r.data){location.href='/painel';return false}return true}async function load(){if(!await auth())return;const{data,error}=await db.from('cupons').select('*').order('criado_em',{ascending:false});if(error){list.innerHTML='<p class="error">'+error.message+'</p>';return}list.innerHTML=data?.length?'':'<p class="muted">Nenhum cupom cadastrado.</p>';for(const c of data||[]){const row=document.createElement('div');row.className='row';row.innerHTML=`<div><strong>${c.codigo}</strong><div class="muted">${c.tipo==='percentual'?c.valor+'%':money(c.valor)} de desconto</div></div><button class="danger">Remover</button>`;row.querySelector('button').onclick=async()=>{if(!confirm('Remover o cupom '+c.codigo+'?'))return;const r=await db.from('cupons').delete().eq('id',c.id);if(r.error)alert(r.error.message);else load()};list.appendChild(row)}}$('#form').onsubmit=async e=>{e.preventDefault();msg.textContent='';if(!await auth())return;const tipo=$('#tipo').value,raw=Number($('#valor').value),valor=tipo==='percentual'?raw:Math.round(raw*100);if(tipo==='percentual'&&(valor<=0||valor>100)){msg.className='error';msg.textContent='Use um percentual entre 0,01 e 100.';return}const payload={codigo:$('#codigo').value.trim().toUpperCase(),tipo,valor,ativo:true};const r=await db.from('cupons').insert(payload);if(r.error){msg.className='error';msg.textContent=r.error.message;return}msg.className='ok';msg.textContent='Cupom adicionado.';e.target.reset();load()};$('#refresh').onclick=load;load();</script></body></html>
